<html lang="pt-BR">
<head>

<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101d32;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{display:grid;place-items:center}.game{position:relative;width:min(100vw,1100px);height:min(100dvh,700px);overflow:hidden;background:#75c9c1;isolation:isolate}.game:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px #10203b55}.sky{position:absolute;inset:0 0 30% 0;background:linear-gradient(#8be2d3,#f9d49d)}.sun{position:absolute;right:12%;top:9%;width:70px;height:70px;border-radius:50%;background:#fff0b3;box-shadow:0 0 45px #fff5c8}.hill{position:absolute;bottom:27%;width:120%;height:29%;left:-10%;border-radius:50% 50% 0 0;background:#66bd78}.hill.back{bottom:30%;left:-35%;height:26%;background:#8bd17d}.ground{position:absolute;bottom:0;height:31%;width:100%;background:linear-gradient(#7bcb73 0 12%,#bb8150 12% 100%);border-top:7px solid #498f5a}.ground:before{content:"";position:absolute;inset:12% 0 0;background:repeating-linear-gradient(110deg,transparent 0 55px,#9d633d 56px 61px,transparent 62px 115px)}canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}.hud{position:absolute;inset:0 0 auto;z-index:3;display:flex;justify-content:space-between;align-items:flex-start;padding:18px 22px;pointer-events:none}.brand{font-weight:900;font-size:clamp(17px,3vw,25px);letter-spacing:.02em;text-shadow:0 2px 4px #243a40}.score{background:#122b38c9;border:1px solid #ffffff40;border-radius:14px;padding:8px 14px;font-weight:800;font-variant-numeric:tabular-nums}.power{position:absolute;left:50%;top:17%;transform:translateX(-50%);z-index:3;padding:8px 13px;border-radius:18px;background:#182e45d9;font-weight:750;white-space:nowrap;opacity:0;transition:opacity .2s}.power.show{opacity:1}.overlay{position:absolute;inset:0;display:grid;place-items:center;z-index:4;background:#11243a44}.card{width:min(88%,410px);padding:25px 25px 21px;text-align:center;border:1px solid #ffffff66;background:#173349eF;border-radius:25px;box-shadow:0 16px 50px #16304455}.card h1{margin:0 0 8px;font-size:clamp(27px,6vw,42px);line-height:1.06}.card p{color:#d9ece3;line-height:1.5;margin:10px 0 18px}.card .animals{font-size:33px;letter-spacing:7px;margin:12px}.btn{border:0;border-radius:15px;background:#ffd166;color:#293448;font-weight:900;font-size:17px;padding:13px 24px;cursor:pointer;box-shadow:0 4px 0 #d49a36}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d49a36}.hint{font-size:12px!important;margin:16px 0 0!important;color:#c5d8d7!important}.controls{position:absolute;bottom:14px;left:0;right:0;display:none;justify-content:space-between;padding:0 18px;z-index:3;pointer-events:none}.control{pointer-events:auto;width:73px;height:62px;border:1px solid #ffffff70;border-radius:19px;background:#17364bbd;color:white;font-size:26px;font-weight:900;touch-action:none}.control.jump{width:104px;background:#ffd166e8;color:#293448;font-size:16px}.hidden{display:none!important}@media(max-width:600px){.game{height:100dvh}.controls{display:flex}.hud{padding:13px 14px}.power{top:13%}.sun{width:55px;height:55px}}
.control.attack{width:84px;background:#bd67e8e8;color:white;font-size:14px}

.pause-btn{position:absolute;right:18px;top:116px;z-index:4;border:1px solid #ffffff70;border-radius:13px;background:#17364bdc;color:#fff;padding:8px 12px;font-weight:800;cursor:pointer}.pause-btn:hover{background:#244d60}.btn.secondary{margin-top:10px;background:#a9d9e8;box-shadow:0 4px 0 #679aaa}
.fullscreen-btn{position:absolute;right:18px;top:164px;z-index:4;border:1px solid #ffffff70;border-radius:13px;background:#17364bdc;color:#fff;padding:8px 12px;font-weight:800;cursor:pointer}.fullscreen-btn:hover{background:#244d60}#game:fullscreen{width:100vw;height:100dvh;max-width:none;border-radius:0}
@media(max-width:600px){.audio-btn{top:56px;right:12px;padding:7px 9px;font-size:12px}}
@media(max-width:600px){.pause-btn{top:99px;right:12px;padding:7px 9px;font-size:12px}}
@media(max-width:600px){.fullscreen-btn{top:142px;right:12px;padding:7px 9px;font-size:12px}}
@media(pointer:coarse){.game{height:100dvh}.controls{display:flex}}
</style></head>
<body><main class="game" id="game"><div class="sky"></div><div class="sun"></div><div class="hill back"></div><div class="hill"></div><div class="ground"></div><canvas id="canvas"></canvas>
<div class="hud"><div class="brand">🧬 MIG RUN</div><div class="score">⭐ <span id="score">0</span> m · ❤️ <span id="lives">2</span></div></div><div class="power" id="power"></div>
<button class="audio-btn" id="audioToggle" aria-label="Desligar música e sons">🎵 SOM: LIGADO</button>
<button class="pause-btn hidden" id="pauseBtn">⏸ PAUSAR</button>
<button class="fullscreen-btn" id="fullscreenBtn">⛶ TELA CHEIA</button>
<div class="overlay" id="overlay"><section class="card"><div class="animals">🐍 🦍 👽</div><h1 id="title">Mig Run</h1><p id="desc">Corrida selvagem infinita! Desvie dos obstáculos, colete mutações e enfrente mini chefes.</p><button class="btn" id="start">Começar a correr</button><button class="btn secondary hidden" id="pauseSound">🎵 SOM: LIGADO</button><p class="hint">Pular: toque / Espaço · Atacar: botão / X</p></section></div>
<div class="controls"><button class="control" id="paw" aria-label="Pular">🐾</button><button class="control jump" id="jump">PULAR ↑</button><button class="control attack" id="attack">ATACAR ✦</button></div></main>
<script>
(()=>{
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),game=document.querySelector('#game'),scoreEl=document.querySelector('#score'),overlay=document.querySelector('#overlay'),powerEl=document.querySelector('#power');
let w=0,h=0,scale=1,run=false,paused=false,last=0,rafId=0,distance=0,speed=280,score=0,player,obstacles=[],pickups=[],particles=[],shots=[],bossHazards=[],active=null,boss=null,bossesDefeated=0,spawn=0,pickSpawn=4,lastAttackAt=0,groundY=0,audioCtx=null,musicTimer=null,musicStep=0,musicMode='normal',soundOn=true;
const powers=[{name:'Super pulo',icon:'🐇',color:'#ffe078',duration:6,jump:1.65},{name:'Asas',icon:'🦅',color:'#a7e9ff',duration:6,fly:1},{name:'Velocidade x2',icon:'🐆',color:'#ffc17a',duration:5,mult:2},{name:'Velocidade x3',icon:'🐎',color:'#ff9da8',duration:3.5,mult:3},{name:'Garras',icon:'🐻',color:'#d6a7ff',duration:6,claws:1},{name:'Forma de serpente',icon:'🐍',color:'#74e89c',duration:9,form:'snake'},{name:'Forma de gorila',icon:'🦍',color:'#bd9872',duration:9,form:'gorilla'},{name:'Forma alienígena',icon:'👽',color:'#a694ff',duration:9,form:'alien'}];
const bossTypes=[{name:'Serpente venenosa',form:'snake',icon:'🐍',color:'#68bb68',lives:8},{name:'Gorila rochoso',form:'gorilla',icon:'🦍',color:'#a77a55',lives:12},{name:'Alien selvagem',form:'alien',icon:'👽',color:'#9266e8',lives:16}];
function resize(){const r=game.getBoundingClientRect();w=r.width;h=r.height;scale=Math.min(devicePixelRatio||1,2);canvas.width=w*scale;canvas.height=h*scale;ctx.setTransform(scale,0,0,scale,0,0);groundY=h*.70;if(player){player.x=w*.22;player.y=Math.min(player.y,groundY-player.size)}}addEventListener('resize',resize);resize();
function reset(){distance=0;speed=280;score=0;obstacles=[];pickups=[];particles=[];shots=[];bossHazards=[];active=null;boss=null;bossesDefeated=0;setMusicMode('normal');spawn=.8;pickSpawn=5.5;lastAttackAt=0;player={x:w*.22,y:groundY-48,size:48,vy:0,ground:true,angle:0,lives:2,hurtTimer:0};scoreEl.textContent='0';document.querySelector('#lives').textContent='2';powerEl.classList.remove('show')}
function begin(){if(rafId)cancelAnimationFrame(rafId);reset();paused=false;overlay.classList.add('hidden');document.querySelector('#pauseSound').classList.add('hidden');document.querySelector('#pauseBtn').classList.remove('hidden');run=true;last=performance.now();if(soundOn)startAudio();rafId=requestAnimationFrame(frame)}
function pauseGame(){if(!run||paused)return;paused=true;if(rafId)cancelAnimationFrame(rafId);rafId=0;stopAudio();overlay.classList.remove('hidden');document.querySelector('#title').textContent='Jogo pausado';document.querySelector('#desc').textContent='Sua corrida está parada. Continue quando estiver pronto.';document.querySelector('#start').textContent='Continuar';document.querySelector('#pauseSound').classList.remove('hidden');document.querySelector('#pauseBtn').classList.add('hidden');updateSoundLabels()}
function resumeGame(){paused=false;overlay.classList.add('hidden');document.querySelector('#pauseSound').classList.add('hidden');document.querySelector('#pauseBtn').classList.remove('hidden');last=performance.now();if(soundOn)startAudio();rafId=requestAnimationFrame(frame)}
function finish(){run=false;paused=false;document.querySelector('#pauseBtn').classList.add('hidden');document.querySelector('#pauseSound').classList.add('hidden');playSfx('fail');overlay.classList.remove('hidden');document.querySelector('#title').textContent='Fim de corrida!';document.querySelector('#desc').innerHTML=`Você correu <b>${score} m</b> e venceu <b>${bossesDefeated}</b> mini chefes. Tente chegar ainda mais longe!`;document.querySelector('#start').textContent='Tentar de novo'}
function takeHit(message){if(!player||player.hurtTimer>0)return;player.lives--;player.hurtTimer=1.35;document.querySelector('#lives').textContent=player.lives;playSfx('fail');if(player.lives<=0){finish();return}powerEl.textContent=`${message} · ${player.lives} vida${player.lives===1?'':'s'} restante${player.lives===1?'':'s'}`;powerEl.classList.add('show')}
function jump(){if(!run)return;if(player.ground||active?.fly){player.vy=active?.jump? -790: -620;player.ground=false;if(active?.fly)player.vy=-420;playSfx('jump');burst(player.x+20,groundY-4,'#fff0a5',5)}}
function burst(x,y,color,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*180,vy:-Math.random()*150,life:.5,color})}
function startAudio(){if(!soundOn||paused)return;if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();if(musicTimer)return;musicStep=0;musicTimer=setInterval(musicTick,musicMode==='boss'?105:150)}
function stopAudio(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}if(audioCtx&&audioCtx.state==='running')audioCtx.suspend()}
function setMusicMode(mode){if(musicMode===mode)return;musicMode=mode;if(musicTimer){clearInterval(musicTimer);musicTimer=setInterval(musicTick,musicMode==='boss'?105:150)}musicStep=0}
function tone(freq,duration,wave='square',volume=.035,delay=0,slide=0){if(!soundOn)return;if(!audioCtx)startAudio();if(!audioCtx)return;const t=audioCtx.currentTime+delay,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=wave;osc.frequency.setValueAtTime(freq,t);if(slide)osc.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t+duration);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(volume,t+.012);gain.gain.exponentialRampToValueAtTime(.0001,t+duration);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+duration+.02)}
function musicTick(){if(!soundOn||!audioCtx)return;const normal=[523,659,784,659,587,740,880,740,523,659,988,784,587,698,880,698],battle=[392,523,659,784,392,587,740,880,349,523,698,880,392,587,784,988],seq=musicMode==='boss'?battle:normal,step=musicStep%16;tone(seq[step],musicMode==='boss'?.09:.115,musicMode==='boss'?'sawtooth':'square',musicMode==='boss'?.024:.016);if(step%4===0)tone(musicMode==='boss'?[98,123,110,92][Math.floor(step/4)]:[131,165,147,110][Math.floor(step/4)],.24,'triangle',musicMode==='boss'?.075:.055);if(step%4===0)tone(musicMode==='boss'?115:95,.09,'sine',musicMode==='boss'?.065:.045,0,-65);else if(step%2===0)tone(musicMode==='boss'?1600:1200,.025,'square',musicMode==='boss'?.012:.008);if(musicMode==='boss'&&(step===2||step===6||step===10||step===14))tone(190,.065,'triangle',.04);else if(step===4||step===12)tone(190,.07,'triangle',.025);musicStep++}
function playSfx(kind){if(!soundOn)return;if(!audioCtx)startAudio();if(!audioCtx)return;if(kind==='jump')tone(280,.17,'square',.035,0,280);if(kind==='pickup'){tone(660,.11,'triangle',.05);tone(880,.13,'triangle',.05,.1);tone(1175,.19,'triangle',.05,.22)}if(kind==='attack'){tone(240,.11,'sawtooth',.035,0,260);tone(430,.07,'square',.018,.04)}if(kind==='hit')tone(150,.14,'triangle',.05,0,-65);if(kind==='win'){tone(523,.15,'triangle',.05);tone(659,.15,'triangle',.05,.13);tone(784,.27,'triangle',.06,.26)}if(kind==='fail')tone(280,.38,'triangle',.045,0,-170)}
function updateSoundLabels(){for(const b of [document.querySelector('#audioToggle'),document.querySelector('#pauseSound')]){if(!b)continue;b.textContent=soundOn?'🎵 SOM: LIGADO':'🔇 SOM: DESLIGADO';b.setAttribute('aria-label',soundOn?'Desligar música e sons':'Ligar música e sons')}}
function toggleSound(){soundOn=!soundOn;updateSoundLabels();if(soundOn){if(!paused){startAudio();playSfx('pickup')}}else stopAudio()}
document.querySelector('#audioToggle').addEventListener('click',toggleSound);document.querySelector('#pauseSound').addEventListener('click',toggleSound);document.querySelector('#pauseBtn').addEventListener('click',pauseGame);
document.querySelector('#fullscreenBtn').addEventListener('click',async()=>{try{if(document.fullscreenElement){await document.exitFullscreen()}else if(game.requestFullscreen){await game.requestFullscreen()}else if(game.webkitRequestFullscreen){game.webkitRequestFullscreen()}else{powerEl.textContent='Tela cheia não disponível neste navegador.';powerEl.classList.add('show')}}catch{powerEl.textContent='Não foi possível ativar a tela cheia.';powerEl.classList.add('show')}});
document.addEventListener('fullscreenchange',resize);
document.querySelector('#start').addEventListener('click',()=>paused?resumeGame():begin());document.querySelector('#jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.querySelector('#paw').addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.querySelector('#attack').addEventListener('pointerdown',e=>{e.preventDefault();attack()});
addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!run)begin();else if(!paused)jump()}if(e.code==='KeyX'||e.code==='KeyJ')attack();if(e.code==='KeyP'||e.code==='Escape'){if(run&&!paused)pauseGame();else if(run&&paused)resumeGame()}if(e.code==='Enter'&&!run)begin()});game.addEventListener('pointerdown',e=>{if(run&&!paused&&!e.target.closest('button'))jump()});
function frame(now){if(!run||paused){rafId=0;return}const dt=Math.min((now-last)/1000,.04);last=now;update(dt);draw();rafId=run&&!paused?requestAnimationFrame(frame):0}
function nextBossMark(){const cycle=Math.floor(bossesDefeated/3),stage=bossesDefeated%3;return [5000,10000,30000][stage]+cycle*30000}
function startBoss(){const cycle=Math.floor(bossesDefeated/3),type=bossTypes[bossesDefeated%3];boss={...type,hp:type.lives+cycle*4,maxHp:type.lives+cycle*4,x:w*.78,y:groundY-65,bob:0,attackTimer:1.25,attacks:0,drainTimer:0,savedForm:null};active={name:type.name,icon:type.icon,color:type.color,form:type.form,t:999999};setMusicMode('boss');powerEl.textContent=`CHEFE! ${type.icon} ${type.name} · Use X / ATACAR`;powerEl.classList.add('show');shots=[];bossHazards=[];obstacles=[];pickups=[]}
function attack(){if(!run||!active?.form){if(boss&&boss.drainTimer>0)powerEl.textContent='Mutação roubada! Desvie até ela voltar.';return}if(boss&&active.form!==boss.form){powerEl.textContent=`${boss.icon} Precisa da forma certa: ${boss.name}!`;return}const now=performance.now();if(now-lastAttackAt<520)return;lastAttackAt=now;const target=boss?{x:boss.x,y:boss.y}:obstacles.find(o=>!o.broken&&o.x>player.x),x=player.x+player.size,y=target?target.y+(target.height||0)*.45:player.y+player.size*.45,color=active.form==='snake'?'#75f08e':active.form==='gorilla'?'#d2a77f':'#b8a2ff';if(active.form==='gorilla'){shots.push({x,y,vx:390,vy:-230,gravity:720,form:'gorilla',color,r:9,rock:true});shots.push({x,y:groundY-3,vx:500,form:'gorilla',color,r:17,wave:true})}else shots.push({x,y,vx:420,form:active.form,color,r:6});playSfx('attack');burst(x,y,color,4)}
function update(dt){if(!boss){distance+=dt*speed*(active?.mult||1);score=Math.floor(distance/10);scoreEl.textContent=score;speed=Math.min(500,280+distance/250);if(score>=nextBossMark())startBoss()}
if(active&&active.t<99999){active.t-=dt;if(active.t<=0){active=null;powerEl.classList.remove('show')}}
if(player.hurtTimer>0)player.hurtTimer=Math.max(0,player.hurtTimer-dt);const previousY=player.y;player.vy+=1500*dt;player.y+=player.vy*dt;if(player.y>=groundY-player.size){player.y=groundY-player.size;player.vy=0;player.ground=true}if(active?.fly&&player.y>groundY-145){player.y=groundY-145;player.vy=0}
if(!boss){spawn-=dt;if(spawn<=0){const height=30+Math.random()*25;obstacles.push({x:w+30,y:groundY-height,width:30+Math.random()*22,height,broken:false});spawn=Math.max(.72,1.65-distance/4500)+Math.random()*.65}
pickSpawn-=dt;if(pickSpawn<=0){pickups.push({x:w+25,y:groundY-78-Math.random()*48,r:19,power:powers[Math.floor(Math.random()*powers.length)],bob:Math.random()*7});pickSpawn=7.5+Math.random()*3.5}}
if(!boss)for(const o of obstacles)o.x-=speed*(active?.mult||1)*dt;for(const p of pickups){p.x-=speed*(active?.mult||1)*dt;p.bob+=dt*4}
obstacles=obstacles.filter(o=>o.x+o.width>0);pickups=pickups.filter(p=>p.x+p.r>0);
for(const p of pickups){if(Math.abs(p.x-(player.x+player.size/2))<p.r+player.size*.35&&Math.abs((p.y+Math.sin(p.bob)*5)-(player.y+player.size/2))<p.r+player.size*.35){active={...p.power,t:p.power.duration};powerEl.textContent=`${p.power.icon} ${p.power.name}!`;powerEl.classList.add('show');playSfx('pickup');burst(p.x,p.y,p.power.color,14);p.x=-100}}
if(boss){boss.bob+=dt;boss.attackTimer-=dt;if(boss.drainTimer>0){boss.drainTimer-=dt;if(boss.drainTimer<=0&&boss.savedForm){active=boss.savedForm;boss.savedForm=null;powerEl.textContent=`${active.icon} Mutação recuperada!`;powerEl.classList.add('show')}}if(boss.attackTimer<=0){boss.attacks++;boss.attackTimer=1.45+Math.random()*.55;if(boss.attacks%3===0&&active?.form){boss.savedForm={...active};active=null;boss.drainTimer=2.5;powerEl.textContent='O chefe roubou sua mutação por um instante!';powerEl.classList.add('show')}else{bossHazards.push({x:boss.x-38,y:groundY-30,width:34,height:26,vx:-(330+Math.random()*90),rot:0,color:boss.color});playSfx('attack')}}}
for(const hazard of bossHazards){hazard.x+=hazard.vx*dt;hazard.rot+=dt*5}
for(const hazard of bossHazards){const hitX=player.x+player.size*.76>hazard.x&&player.x+player.size*.24<hazard.x+hazard.width,hitY=player.y+player.size*.84>hazard.y&&player.y+player.size*.2<hazard.y+hazard.height,prevFeet=previousY+player.size*.84;if(hitX&&hitY&&player.hurtTimer<=0){if(player.vy>0&&prevFeet<=hazard.y+7){player.y=hazard.y-player.size*.84;player.vy=-430;player.ground=false;burst(hazard.x+hazard.width/2,hazard.y,hazard.color,10);hazard.x=-100}else{hazard.x=-100;takeHit('O chefe acertou você!');if(!run)break}}}bossHazards=bossHazards.filter(o=>o.x+o.width>0)
for(const s of shots){s.x+=s.vx*dt;if(s.rock){s.y+=s.vy*dt;s.vy+=s.gravity*dt}if(boss&&s.x>=boss.x-35&&(!s.rock||Math.abs(s.y-boss.y)<65)){boss.hp--;s.x=-100;playSfx(boss.hp<=1?'win':'hit');burst(boss.x-25,boss.y,s.color,7);if(boss.hp<=0){burst(boss.x,boss.y,boss.color,28);boss=null;bossesDefeated++;setMusicMode('normal');shots=[];bossHazards=[];active=null;powerEl.textContent='Chefe derrotado! Continue a corrida';setTimeout(()=>{if(!boss)powerEl.classList.remove('show')},1800);break}}else if(!boss){const target=obstacles.find(o=>!o.broken&&(s.wave?(s.x+s.r>=o.x&&s.x-s.r<=o.x+o.width):(s.x>=o.x&&s.x<=o.x+o.width&&s.y>=o.y-12&&s.y<=groundY+8)));if(target){target.broken=true;s.x=-100;playSfx('hit');burst(target.x+target.width/2,target.y,target.formColor||s.color,12)}}}shots=shots.filter(s=>s.x<w+25&&s.x>=0&&(!s.rock||s.y<groundY+20))
if(!boss)for(const o of obstacles){if(o.broken)continue;const hitX=player.x+player.size*.76>o.x&&player.x+player.size*.25<o.x+o.width,feet=player.y+player.size*.85,prevFeet=previousY+player.size*.85;if(hitX&&feet>o.y&&player.hurtTimer<=0){if(player.vy>0&&prevFeet<=o.y+7){player.y=o.y-player.size*.85;player.vy=-460;player.ground=false;o.broken=true;playSfx('hit');burst(o.x+o.width/2,o.y,'#ffd166',10);break}else if(active?.claws){o.broken=true;burst(o.x,o.y,'#ffd166',12)}else{o.broken=true;takeHit('Você bateu de frente!');if(!run)break}}}
particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.life-=dt});particles=particles.filter(p=>p.life>0)
}
function draw(){ctx.clearRect(0,0,w,h);const gy=groundY;ctx.save();ctx.translate(0,0);
// Running ground marks
ctx.strokeStyle='#f2d19b';ctx.lineWidth=3;for(let x=-(distance%95);x<w;x+=95){ctx.beginPath();ctx.moveTo(x,gy+30);ctx.lineTo(x-22,gy+54);ctx.stroke()}
// pick-ups
